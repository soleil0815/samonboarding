# The only workflow: checks the code (ruff, tests), builds the ready-made Docker image on every push to main, scans it
# for known vulnerabilities (Trivy) and publishes it as ghcr.io/<owner>/samonboarding:latest and :<version>.
# Published only if the tests pass with exactly the Python packages that go into the image AND Trivy finds no
# CRITICAL/HIGH vulnerability for which a fixed version exists. Accepted findings: .trivyignore (with reason).
# Additionally every Monday: the same run again without a code change - rebuilt with the newest packages and Debian
# security updates, tested, scanned, and published under :latest only if everything passes.
# Job "support": fails (GitHub sends an e-mail) half a year before Debian, Python or Node stop getting updates -
# then the base in images.lock has to be raised. It does not stop the image from being published.
name: Image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC: rebuild with current components (same checks as a push)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # the token must not be readable for the packages installed below

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"  # same minor version as in the Docker image, newest patch version

      # requirements.txt in the repository is not maintained by hand - pin the newest versions allowed by
      # requirements.in (like "update.sh --lock" does on a server) and check them with the test suite
      - name: Pin Python packages and test them
        run: |
          python -m venv /tmp/neu
          /tmp/neu/bin/pip install --quiet --disable-pip-version-check -r requirements.in
          /tmp/neu/bin/pip check
          {
            echo "# Exact lock list of all Python packages (including dependencies) for reproducible builds."
            echo "# Generated from requirements.in by GitHub Actions for the published image, checked with the test suite."
            echo "# requirements.in: $(sha256sum requirements.in | cut -c1-16)"
            /tmp/neu/bin/pip freeze | LC_ALL=C sort -f
          } > requirements.txt
          cat requirements.txt
          # also as an annotation of the run, so the tested lock list can be taken over into the repository
          echo "::notice title=requirements.txt::$(base64 -w0 requirements.txt)"
          /tmp/neu/bin/pip install --quiet --disable-pip-version-check pytest "ruff==$(sed -n 's/^ruff==//p' requirements-dev.txt)"
          /tmp/neu/bin/ruff check .
          /tmp/neu/bin/ruff format --check .
          /tmp/neu/bin/python -m pytest -q
          /tmp/neu/bin/python tests/smoke_app.py

      - name: Version and base images
        id: meta
        run: |
          echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' samonboarding/config.py)" >> "$GITHUB_OUTPUT"
          echo "python=$(sed -n 's/^PYTHON_IMAGE=//p' images.lock | tail -n1)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^NODE_IMAGE=//p' images.lock | tail -n1)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3 - also for ARM devices (e.g. some Synology models)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Build once for the scan (amd64, only locally), scan, publish only afterwards
      - name: Build image for the vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: samonboarding:scan
          build-args: |
            PYTHON_IMAGE=${{ steps.meta.outputs.python }}
            NODE_IMAGE=${{ steps.meta.outputs.node }}
            APT_REFRESH=${{ github.run_id }}
          pull: true  # always fetch the current base image (newest patch version)
          cache-from: type=gha

      - name: Start check of the built image (all packages can be imported)
        run: docker run --rm --entrypoint python samonboarding:scan -c "import samonboarding.main, smbclient, pypsrp.powershell, ldap3; print('import ok')"

      # The packages are updated every week: really start the server (HTTPS) and ask it, as the health check does
      - name: Start check of the running server (HTTPS answers)
        run: |
          docker run -d --name samonb-smoke samonboarding:scan
          for i in $(seq 1 30); do
            if docker exec samonb-smoke python -c "import ssl, urllib.request; print(urllib.request.urlopen('https://localhost:9500/api/public-config', timeout=3, context=ssl._create_unverified_context()).read().decode())"; then
              docker rm -f samonb-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs samonb-smoke
          docker rm -f samonb-smoke >/dev/null
          echo "::error title=Start check::the server in the image does not answer on HTTPS"
          exit 1

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: samonboarding:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true  # only findings for which a fixed version exists stop the publication
          trivyignores: .trivyignore
          format: json
          output: trivy.json

      - name: Vulnerability report
        run: |
          found="$(jq -r '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + .PkgName)
            | .[] | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) (\(.PkgPath // .Target // "-"))"' trivy.json)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            # one annotation with the whole list (visible on the run page and via the API)
            echo "::error title=Trivy::$(printf '%s\n' "$found" | head -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "Trivy: no CRITICAL/HIGH vulnerabilities with an available fix."

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        if: github.ref == 'refs/heads/main'  # only main publishes images
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            PYTHON_IMAGE=${{ steps.meta.outputs.python }}
            NODE_IMAGE=${{ steps.meta.outputs.node }}
            APT_REFRESH=${{ github.run_id }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=SAMONBOARDING
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  support:
    runs-on: ubuntu-latest
    steps:
      - name: End of support of the base (Debian, Python, Node)
        env:
          # Ends of the regular security support (Debian: security team, after that only partial LTS)
          DEBIAN_13_END: "2028-08-09"
          PYTHON_313_END: "2029-10-31"
          NODE_24_END: "2028-04-30"
        run: |
          soon="$(date -u -d '+183 days' +%Y-%m-%d)"
          late=""
          for entry in "Debian 13 (Trixie)=$DEBIAN_13_END" "Python 3.13=$PYTHON_313_END" "Node 24 (build only)=$NODE_24_END"; do
            name="${entry%%=*}"; end="${entry##*=}"
            echo "$name: updates until $end"
            if [[ "$end" < "$soon" ]]; then late="$late$name ends $end; "; fi
          done
          if [ -n "$late" ]; then
            echo "::error title=Support ending::${late}raise the base in images.lock"
            exit 1
          fi
