# Check, release and monthly security update (patch day) of the image ghcr.io/<owner>/samonboarding.
#
# Check (pull request, push to main): build exactly the pinned state, test in the image, start check, Trivy -
#   nothing is published. A new version only comes via a pull request.
# Release (only by hand: Actions -> Image -> Run workflow -> release, on main): the same, then publish as :<version>
#   (plus :<major>.<minor> and :latest if it is the highest) - only if this version is not published yet (published
#   versions are never overwritten). Release page with docker-compose.yml, env.example and the image files
#   (docker load, for servers without internet).
# Security update (on patch day – the second Tuesday of the month, like Microsoft's Patch Tuesday, the same day in all
#   programs – 05:17 UTC, or by hand at any time; the schedule starts every Tuesday, scripts/patchday.sh only lets the
#   second one through): renew the pins within the base (scripts/pins.py update), build
#   without cache, test in the image, scan with Trivy. Only if everything passed: commit the new pins with a changelog
#   entry and publish as :<version>-s<counter>. If no package changed: nothing happens.
# :latest only goes to the highest version. On other branches every run is a dry run: nothing is committed or published.
# If a step fails nothing is published, GitHub sends an e-mail and the cause is shown on the run page.
#
# Rights: the steps are in build.yml. The check job (pull requests, pushes) only gets a read-only token, so code from
# a pull request can never commit or publish. Only the release job (by hand or scheduled, never for a pull request)
# gets write rights, and it publishes only on main.
name: Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 2" # Tuesdays 05:17 UTC: security update within the base, only on patch day (job patchday)
  workflow_dispatch:
    inputs:
      mode:
        description: "release: publish the version on main - security-update: renew packages within the base"
        type: choice
        options: [security-update, release]
        default: security-update

permissions: {}

concurrency:
  # never two releases at the same time; checks of a pull request run separately
  group: ${{ github.event_name == 'pull_request' && format('image-pr-{0}', github.ref) || 'image-release' }}
  cancel-in-progress: false

jobs:
  patchday:
    # scheduled: only the Tuesday run on patch day goes on (a cron line cannot say "second Tuesday"); by hand: any day
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/patchday.sh
          sparse-checkout-cone-mode: false
      - name: Patch day?
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ] || sh scripts/patchday.sh; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security update::Not patch day - the security update runs on the second Tuesday of the month."
          fi

  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      packages: read # only to read the published tags (version check)
    uses: ./.github/workflows/build.yml
    with:
      mode: check
      publish: false

  release:
    # only after the job patchday, i.e. only scheduled (on patch day) or by hand
    needs: patchday
    if: needs.patchday.outputs.due == 'true'
    permissions:
      contents: write # only for the commit of a security update (main only)
      packages: write # only for publishing the image (main only)
    uses: ./.github/workflows/build.yml
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'security-update' }}
      publish: ${{ github.ref == 'refs/heads/main' }}
