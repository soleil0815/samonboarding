# SAMONBOARDING - docker-compose.yml
#
# Installation: put this file and your .env (from .env.example) into one folder, then:  docker compose up -d
# Do not change this file - settings belong in .env. Defaults are in the program, so this file rarely changes; the
# version of this file is SAMONBOARDING_COMPOSE below. If it is too old, the program shows a note to administrators,
# and "sh update.sh" replaces it automatically (the old one stays as docker-compose.yml.alt). Every image carries the
# current file, every release on GitHub offers it for download.
#
# On the host there is only: docker-compose.yml, .env and the folder data/ (settings, databases, certificate and the
# backups in data/backups). The program is completely in the image.
services:
  samonboarding:
    # SAMONBOARDING_VERSION in .env: empty = latest; "2.0" = newest 2.0.x including security updates;
    # "2.0.0" = exactly this version (security updates of it are then 2.0.0-s1, 2.0.0-s2, ...)
    image: ghcr.io/soleil0815/samonboarding:${SAMONBOARDING_VERSION:-latest}
    # Started as root only to hand ./data over to the application user (10001), then it switches to that user for
    # good and all rights are gone (docker-entrypoint.sh in the image). Only these rights, only for that moment:
    # read a folder of another owner, change the owner, switch the user.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      SAMONBOARDING_COMPOSE: "2"   # version of this file
    ports:
      - "${HTTPS_PORT:-9500}:${HTTPS_PORT:-9500}"   # HTTPS only: https://<server>:<HTTPS_PORT>
    volumes:
      - ./data:/app/data   # everything the program stores; backups before a version change in data/backups
    restart: unless-stopped
    networks:
      - samonboarding
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Own network with a fixed name and subnet (DOCKER_SUBNET in .env), so it can be restricted in a firewall if needed
networks:
  samonboarding:
    name: samonboarding
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-samonb
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.80.0/24}
