# Please do NOT edit this file - it is replaced with every new version.
# Your settings are in .env (once: cp .env.example .env).
services:
  samonboarding:
    # Ready-made image from GitHub (sudo sh update.sh --pull) - or built here from these files (sudo sh update.sh)
    image: ${SAMONBOARDING_IMAGE:-ghcr.io/soleil0815/samonboarding:latest}
    build:
      context: .
      args:
        # Base images with fixed versions; update.sh sets them from images.lock (including digest)
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11.13-slim-bookworm}
        NODE_IMAGE: ${NODE_IMAGE:-node:22.17.0-bookworm-slim}
        APT_REFRESH: ${APT_REFRESH:-}   # update.sh sets the date: current Debian security updates on every build
    env_file:
      - .env   # your settings (update.sh creates them from .env.example the first time); simple syntax so that
               # older Docker Compose versions (e.g. on a Synology) can read the file too
    ports:
      - "${HTTPS_PORT:-9500}:${HTTPS_PORT:-9500}"   # HTTPS only: https://<server>:<HTTPS_PORT>
    volumes:
      - ./data:/app/data              # configuration, templates, reports (reports.db), certificate (tls/)
    restart: unless-stopped
    # No root, no special privileges: the application runs as user 10001 (Dockerfile), may not gain privileges
    # and has no Linux capabilities (port 9500 needs none)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - samonboarding
    healthcheck:
      test: ["CMD", "python", "-c", "import os, ssl, urllib.request; urllib.request.urlopen('https://localhost:%s/api/public-config' % os.environ.get('HTTPS_PORT', '9500'), timeout=3, context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Own network with a fixed name and subnet (DOCKER_SUBNET in .env) - so it can be restricted specifically in a
# firewall if needed
networks:
  samonboarding:
    name: samonboarding
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-samonb
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.80.0/24}
