# SAMONBOARDING with the ready-made image from GitHub (ghcr.io) - for Dockhand, Portainer & co. or plain
# "docker compose -f docker-compose.image.yml up -d". Nothing is built on the server: GitHub builds and tests the
# image on every new version (.github/workflows/image.yml).
#
# Settings: as variables of the stack (in Dockhand: environment / stack variables) or in a .env file next to this
# file - the same names as in .env.example. AD_DOMAIN and AD_DC_IP are required.
# Data (settings, templates, reports, certificate) lives in the Docker volume "samonboarding-data".
# A specific version instead of the newest one: SAMONBOARDING_VERSION=1.41.0
services:
  samonboarding:
    image: ghcr.io/soleil0815/samonboarding:${SAMONBOARDING_VERSION:-latest}
    environment:
      AD_DOMAIN: ${AD_DOMAIN:?AD_DOMAIN is required (DNS name of the domain)}
      AD_DC_IP: ${AD_DC_IP:?AD_DC_IP is required (IP or name of the domain controller)}
      CUSTOM_OPERATOR_GROUP: ${CUSTOM_OPERATOR_GROUP:-}
      TZ: ${TZ:-Europe/Berlin}
      HTTPS_PORT: ${HTTPS_PORT:-9500}
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}
      LDAP_ALLOW_PLAIN: ${LDAP_ALLOW_PLAIN:-false}
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-5}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      OFFBOARD_RETENTION_DAYS: ${OFFBOARD_RETENTION_DAYS:-180}
    ports:
      - "${HTTPS_PORT:-9500}:${HTTPS_PORT:-9500}"   # HTTPS only: https://<server>:<HTTPS_PORT>
    volumes:
      # Docker volume: gets the right owner (user 10001 in the container) automatically on first start
      - samonboarding-data:/app/data
    restart: unless-stopped
    # No root, no special privileges (as in docker-compose.yml)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  samonboarding-data:
    name: samonboarding-data
