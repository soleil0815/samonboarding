[project]
name = "samonboarding"
description = "AD onboarding, offboarding and account management (FastAPI + ldap3)"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/scenarios", "static"]

[tool.ruff.lint]
# E/W/F/I: style and obvious errors; S: security patterns (Bandit); B: typical Python pitfalls (Bugbear);
# UP: modern syntax; SIM: simpler code
select = ["E", "F", "I", "W", "S", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with Depends(...) etc. as default values - intended there
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.Header", "fastapi.Cookie",
    "fastapi.Form", "fastapi.File", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# HTML templates in strings have long lines
"samonboarding/mailer.py" = ["E501"]
"samonboarding/routers/ui.py" = ["E501"]
# test data (version lists, Trivy reports) is easier to read on one line
"tests/test_pins.py" = ["E501"]
"tests/test_update_sh.py" = ["E501"]
# build and test tools start docker, git, sh and node with fixed argument lists (never via a shell)
"scripts/*.py" = ["S603", "S607"]
# tests: invented passwords and small keys are test data; files stay open on purpose in the fake docker
"tests/*.py" = ["S105", "S106", "S108", "S505", "S603", "S607", "SIM115", "SIM117"]

[tool.pyright]
# Type check of the program and the build scripts ("basic": finds None errors, wrong arguments and attributes,
# unreachable code). Runs in the GitHub workflow against the exact package versions of requirements.txt.
include = ["samonboarding", "app.py", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
